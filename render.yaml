services:
  - type: web
    name: news-crawler-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./news.db
      - key: CRAWL_INTERVAL_MINUTES
        value: 5
      - key: CRAWL_MAX_ARTICLES_PER_SOURCE
        value: 50
      - key: DEBUG
        value: false
      - key: ALLOW_ALL_ORIGINS
        value: true
    plan: free
